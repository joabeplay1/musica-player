<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galactic Music Premium</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="styles/animations.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
</head>
<body>
    <canvas id="galaxy-canvas"></canvas>

    <div class="app-container">
        <aside class="sidebar glass-panel">
            <div class="logo">
                <span class="material-icons-round neon-text">graphic_eq</span>
                <h2>G-Music</h2>
            </div>
            
            <nav class="menu">
                <button class="menu-btn active" data-target="home"><span class="material-icons-round">home</span> Início</button>
                <button class="menu-btn" data-target="playlist"><span class="material-icons-round">queue_music</span> Playlist</button>
                <button class="menu-btn" data-target="upload"><span class="material-icons-round">cloud_upload</span> Adicionar Música</button>
                <button class="menu-btn" data-target="rooms"><span class="material-icons-round">groups</span> Salas Online</button>
                <button class="menu-btn" data-target="monitor"><span class="material-icons-round">analytics</span> Monitor</button>
                <button class="menu-btn" data-target="gallery"><span class="material-icons-round">wallpaper</span> Galeria</button>
            </nav>

            <div class="user-profile">
                <div class="avatar-placeholder"><span class="material-icons-round">person</span></div>
                <span id="user-name">Usuário Premium</span>
            </div>
        </aside>

        <main class="main-content">
            <section id="home-view" class="view active">
                <h1 class="neon-text">Bem-vindo ao Universo Musical</h1>
                <div class="dashboard-widgets">
                    <div class="widget glass-panel">
                        <h3>Música em Destaque</h3>
                        <div id="visualizer">Ondas sonoras aqui...</div>
                    </div>
                </div>
            </section>
        </main>

        <footer class="player-container glass-panel">
            <div class="track-info">
                <div class="cover-wrapper spin-animation" id="current-cover">
                    <span class="material-icons-round">music_note</span>
                </div>
                <div class="track-details">
                    <h4 id="track-title">Selecionar Música</h4>
                    <p id="track-artist">Artista</p>
                </div>
                <button class="icon-btn"><span class="material-icons-round">favorite_border</span></button>
            </div>

            <div class="player-controls">
                <div class="buttons">
                    <button class="icon-btn" id="btn-shuffle"><span class="material-icons-round">shuffle</span></button>
                    <button class="icon-btn" id="btn-prev"><span class="material-icons-round">skip_previous</span></button>
                    <button class="play-btn neon-box" id="btn-play"><span class="material-icons-round">play_arrow</span></button>
                    <button class="icon-btn" id="btn-next"><span class="material-icons-round">skip_next</span></button>
                    <button class="icon-btn" id="btn-repeat"><span class="material-icons-round">repeat</span></button>
                </div>
                <div class="progress-container">
                    <span id="time-current">0:00</span>
                    <input type="range" id="progress-bar" value="0" max="100">
                    <span id="time-total">0:00</span>
                </div>
            </div>

            <div class="volume-controls">
                <span class="material-icons-round">volume_up</span>
                <input type="range" id="volume-bar" value="100" max="100">
            </div>
        </footer>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
